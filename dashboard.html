<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Water Dispenser Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Anton", sans-serif;
        background: linear-gradient(to right, #e0c3fc, #8ec5fc);
        min-height: 100vh;
        margin: 0;
        padding-top: 40px;
      }
      .card {
        border-radius: 15px;
      }
      .form-check-input:checked {
        background-color: #28a745;
        border-color: #28a745;
      }
      .form-check-label {
        font-size: 1.5rem;
        margin-left: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2 class="text-center mb-4">Water Dispenser Dashboard</h2>

      <div class="row g-4">
        <!-- Temperature Card -->
        <div class="col-md-4">
          <div class="card shadow-sm text-center p-3">
            <h5>Water Temperature</h5>
            <p id="temperature" class="display-6">26 °C</p>
          </div>
        </div>

        <!-- Water Level Card -->
        <div class="col-md-4">
          <div class="card shadow-sm text-center p-3">
            <h5>Water Level</h5>
            <p id="waterLevel" class="display-6">70 %</p>
          </div>
        </div>

        <!-- Toggle Switch -->
        <div class="col-md-4">
          <div class="card shadow-sm text-center p-3">
            <h5>Dispenser Control</h5>
            <div
              class="form-check form-switch d-flex justify-content-center align-items-center"
            >
              <input
                class="form-check-input"
                type="checkbox"
                id="toggleSwitch"
              />
              <label
                class="form-check-label"
                for="toggleSwitch"
                id="switchLabel"
                >OFF</label
              >
            </div>
          </div>
        </div>
      </div>

      <!-- View Logs Button -->
      <div class="text-center mt-4">
        <a href="logs.html" class="btn btn-secondary px-4 py-2"
          >View Sensor Logs</a
        >
      </div>
    </div>

    <script>
      const toggleSwitch = document.getElementById("toggleSwitch");
      const switchLabel = document.getElementById("switchLabel");

      toggleSwitch.addEventListener("change", () => {
        if (toggleSwitch.checked) {
          switchLabel.innerText = "ON";
          switchLabel.style.color = "green";
        } else {
          switchLabel.innerText = "OFF";
          switchLabel.style.color = "red";
        }
      });

      // Set initial label color
      switchLabel.style.color = "red";
    </script>
  </body>
</html>
