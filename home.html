<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Water Dispenser Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="background">
    <div class="container py-4">
      <h2 class="text-center">Water Dispenser Dashboard</h2>

      <div class="row g-4">
        <!-- Temperature Card -->
        <div class="col-md-4">
          <div class="card shadow-sm">
            <div class="card-body">
              <h5 class="card-title">Water Temperature</h5>
              <p id="temperature" class="display-6">-- °C</p>
            </div>
          </div>
        </div>

        <!-- Water Level Card -->
        <div class="col-md-4">
          <div class="card shadow-sm">
            <div class="card-body">
              <h5 class="card-title">Water Level</h5>
              <p id="waterLevel" class="display-6">-- %</p>
            </div>
          </div>
        </div>

        <!-- Manual Control -->
        <div class="col-md-4">
          <div class="card shadow-sm">
            <div class="card-body">
              <h5 class="card-title">Dispenser Control</h5>
              <button id="toggleBtn" class="btn btn-primary w-100">
                Turn On
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Link to Logs Page -->
      <div class="text-center mt-4">
        <a href="logs.php" class="btn btn-secondary">View Sensor Logs</a>
      </div>
    </div>

    <script>
      // Simulated fetch (fetch to PHP/ESP32 backend)
      setInterval(() => {
        fetch("get_data.php")
          .then((res) => res.json())
          .then((data) => {
            document.getElementById("temperature").innerText =
              data.temperature + " °C";
            document.getElementById("waterLevel").innerText =
              data.water_level + " %";
          });
      }, 2000);

      // Toggle button control
      document.getElementById("toggleBtn").addEventListener("click", () => {
        fetch("toggle_valve.php", { method: "POST" })
          .then((res) => res.text())
          .then((status) => {
            document.getElementById("toggleBtn").innerText =
              status === "on" ? "Turn Off" : "Turn On";
          });
      });
    </script>
  </body>
</html>
